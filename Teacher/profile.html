<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Exam Tracker</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Jersey+25&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="profile.css">
</head>

<body>

  <div class="app">

    <!--   Sidebar   -->
    <div class="sidebar__backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">Exam Tracker</div>

      <nav class="sidebar__nav">
        <a class="nav-link" href="dashboard.html"><i class="bi bi-bar-chart-fill"></i> Dashboard</a>
        <a class="nav-link" href="student.html"><i class="bi bi-people-fill"></i> Students</a>
        <a class="nav-link" href="exam.html"><i class="bi bi-journal-text"></i> Exams</a>
        <a class="nav-link" href="results.html"><i class="bi bi-clock-history"></i> History</a>
        <a class="nav-link is-active" href="profile.html"><i class="bi bi-person-circle"></i> Profile</a>
      </nav>

      <div class="sidebar__foot">
        <a class="nav-link" href="../public/Login.html" id="logoutBtn"><i class="bi bi-box-arrow-left"></i> Logout</a>
      </div>
    </aside>

    <!--   Main   -->
    <main class="main">

      <div class="d-flex align-items-center gap-2 mb-2">
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu">
          <i class="bi bi-list"></i>
        </button>
      </div>

      <div class="profile-stage">

        <section class="card profile-card">

          <div class="avatar">
            <svg class="avatar__svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img"
              aria-label="Profile picture">
              <defs>
                <clipPath id="avatarClipT">
                  <circle cx="50" cy="50" r="50" />
                </clipPath>
              </defs>
              <g clip-path="url(#avatarClipT)">
                <circle cx="50" cy="50" r="50" fill="#DCE9F2" />
                <path d="M16 100 q5 -30 34 -30 q29 0 34 30 z" fill="#FFBA42" />
                <rect x="44" y="56" width="12" height="16" rx="5" fill="#E39C82" />
                <circle cx="50" cy="44" r="17" fill="#F0B49E" />
                <path d="M33 44 a17 17 0 0 1 34 0 q-5 -9 -17 -7 q-12 2 -17 7 z" fill="#2C2438" />
                <path d="M31 40 q6 -18 24 -16 q14 2 14 12 q-8 -8 -22 -5 q-11 2 -16 9 z" fill="#2C2438" />
              </g>
            </svg>
          </div>

          <p class="profile-name" id="profileName">&nbsp;</p>
          <p class="profile-role">Teacher</p>

          <div class="fields">
            <div class="field">
              <p class="field__label">Username</p>
              <p class="field__value" id="fieldUsername">—</p>
            </div>
            <div class="field">
              <p class="field__label">Phone</p>
              <p class="field__value" id="fieldPhone">—</p>
            </div>
            <div class="field">
              <p class="field__label">Gender</p>
              <p class="field__value" id="fieldGender">—</p>
            </div>
            <div class="field">
              <p class="field__label">National ID</p>
              <p class="field__value" id="fieldNationalId">—</p>
            </div>
          </div>

        </section>

        <!--   Account summary   -->
        <section class="card profile-card profile-card--stats">
          <p class="profile-name">Account</p>
          <p class="profile-role">What you manage</p>

          <div class="fields">
            <div class="field">
              <p class="field__label">Students</p>
              <p class="field__value" id="statStudents">0</p>
            </div>
            <div class="field">
              <p class="field__label">Exams</p>
              <p class="field__value" id="statExams">0</p>
            </div>
            <div class="field">
              <p class="field__label">Active exams</p>
              <p class="field__value" id="statActive">0</p>
            </div>
            <div class="field">
              <p class="field__label">Submissions</p>
              <p class="field__value" id="statResults">0</p>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="../common.js"></script>
  <script src="profile.js"></script>
</body>

</html>
